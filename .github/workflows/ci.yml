name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Run test suite
      run: |
        python -m unittest discover tests -v

    - name: Run ticket linter
      run: |
        python flatmark/flatmark.py lint

    - name: Verify BOARD.md freshness
      run: |
        python flatmark/board.py --check

    - name: Test installer
      run: |
        python install.py /tmp/test-project
        test -d /tmp/test-project/flatmark
        test -f /tmp/test-project/flatmark/BOARD.md
        test -f /tmp/test-project/flatmark/AGENTS.md
        python /tmp/test-project/flatmark/board.py
        python /tmp/test-project/flatmark/board.py --check
        python /tmp/test-project/flatmark/flatmark.py lint
